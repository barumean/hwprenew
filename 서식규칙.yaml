# ============================================================
#  표 서식 일괄정리 규칙  (표샘플.hwp 양식 기준)
#  - 값을 바꾼 뒤 저장하고 표정리.py 를 다시 실행하면 적용됩니다.
#  - 선 종류: 없음, 실선, 파선, 점선, 일점쇄선, 이점쇄선, 긴파선, 원형점선,
#            이중실선, 얇고굵은이중선, 굵고얇은이중선, 삼중선
#  - 선 굵기: 0.1mm 0.12mm 0.15mm 0.2mm 0.25mm 0.3mm 0.4mm 0.5mm
#            0.6mm 0.7mm 1.0mm 1.5mm 2.0mm 3.0mm 4.0mm 5.0mm
#  - 색: "#RRGGBB" 형식 (예: 검정 "#000000", 회색 "#CCCCCC")
# ============================================================

표서식:
  너비: 문서폭             # 문서폭 = 편집영역(용지폭-좌우여백)에 맞춤 / 150mm 등 = 고정값 / 유지
  # 표의 바깥(외곽) 테두리 — 방향별로 다르게 지정 가능
  바깥선:
    위:     { 종류: 실선, 굵기: 0.4mm, 색: "#000000" }
    아래:   { 종류: 실선, 굵기: 0.4mm, 색: "#000000" }
    왼쪽:   { 종류: 없음 }                              # 표샘플: 좌우는 선 없음(개방형)
    오른쪽: { 종류: 없음 }

  # 표 안쪽의 가로/세로 구분선
  안쪽선: { 종류: 실선, 굵기: 0.12mm, 색: "#000000" }

  # 머리글(제목) 행 처리
  머리글행:
    사용: true            # false 로 바꾸면 머리글 행을 따로 처리하지 않습니다
    행수: 1               # 위에서 몇 행을 머리글로 볼지
    배경색: "#CCCCCC"     # 표샘플의 머리글 배경
    아래선: { 종류: 이중실선, 굵기: 0.5mm, 색: "#000000" }   # 머리글과 본문의 구분선

  # 머리글을 제외한 나머지(본문) 셀
  본문셀:
    배경: 지우기          # 지우기 = 셀 배경색 제거 / 유지 = 그대로 둠

# 1행 1열(한 칸)짜리 표 = 그림틀 (표샘플.hwp 기준)
그림틀:
  너비: 문서폭             # 문서폭 / 150mm 등 / 유지
  처리: 정리              # 정리 = 아래 서식 적용 / 건너뛰기 = 그대로 둠
  테두리: { 종류: 실선, 굵기: 0.1mm, 색: "#B3B3B3" }   # 연회색 얇은 선
  배경: 지우기
  번호종류: 그림          # 개체속성 → 기타 → 번호종류 (없음/그림/표/수식)

# 사진(그림 개체)
사진:
  번호종류: 없음          # 개체속성 → 기타 → 번호종류

# 개체 위치 (표와 그림 공통)
개체위치:
  글자처럼취급: 켬        # 켬 = 체크 / 끔 = 해제 / 유지 = 바꾸지 않음
                          # (의도적으로 글자취급을 안 하는 문서는 '유지' 또는 '끔')

# 스타일 목록 정리
스타일정리:
  x스타일제거: 켬         # 켬 = 이름이 x로 시작하는 스타일 삭제(엑셀 붙여넣기 잔재)
                          # 해당 스타일을 쓰던 문단은 '바탕글'로 연결되며 모양은 유지됩니다
